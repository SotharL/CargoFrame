[workspace]
resolver = "2"
members = [
    "core/context",
    "core/safe",
    "core/layout",
    "core/handoff",
]
# Added in later phases, once dependencies can be resolved:
#   core/config, core/rules, core/capture, core/bundle, core/connectors, app/src-tauri

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
