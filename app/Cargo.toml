[package]
name = "cargoframe"
description = "CargoFrame: capture, review and share your screen with its context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "cargoframe"

[lib]
name = "cargoframe_app"

[lints]
workspace = true

# One feature per service. `cargo build --no-default-features --features jira,teams` makes a
# CargoFrame with only those two: the code for the others is not in the program at all.
[features]
default = ["jira", "google", "reddit", "claude", "slack", "discord", "teams", "custom", "x", "bluesky", "instagram", "github"]
jira = ["cargoframe-connectors/jira"]
google = ["cargoframe-connectors/google"]
reddit = ["cargoframe-connectors/reddit"]
claude = ["cargoframe-connectors/claude"]
slack = ["cargoframe-connectors/slack"]
discord = ["cargoframe-connectors/discord"]
teams = ["cargoframe-connectors/teams"]
custom = ["cargoframe-connectors/custom"]
x = ["cargoframe-connectors/x"]
bluesky = ["cargoframe-connectors/bluesky"]
github = ["cargoframe-connectors/github"]
instagram = ["cargoframe-connectors/instagram"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cargoframe-config = { path = "../core/config" }
cargoframe-capture = { path = "../core/capture" }
cargoframe-indicator = { path = "../core/indicator" }
cargoframe-ocr = { path = "../core/ocr" }
cargoframe-shortcuts = { path = "../core/shortcuts" }
cargoframe-context = { path = "../core/context" }
cargoframe-handoff = { path = "../core/handoff" }
cargoframe-deliver = { path = "../core/deliver" }
cargoframe-layout = { path = "../core/layout" }
cargoframe-window = { path = "../core/window" }
cargoframe-rules = { path = "../core/rules" }
cargoframe-bundle = { path = "../core/bundle" }
cargoframe-safe = { path = "../core/safe" }
cargoframe-connectors = { path = "../core/connectors", default-features = false }
cargoframe-net = { path = "../core/net" }
cargoframe-update = { path = "../core/update" }
cargoframe-video = { path = "../core/video" }
tauri-plugin-global-shortcut = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
cargoframe-net = { path = "../core/net", features = ["mock"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
