[package]
name = "cargoframe-capture"
description = "CargoFrame core: find the program in focus and take its screenshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The platform backends call into the operating system. The rest of the workspace forbids
# unsafe code; here it is denied everywhere except the Windows module that needs it.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
thiserror.workspace = true
tracing.workspace = true
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["randr"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
win-screenshot = "4"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
