[workspace]
resolver = "2"
members = [
    "core/context",
    "core/safe",
    "core/layout",
    "core/handoff",
    "core/config",
    "core/capture",
    "core/window",
    "core/rules",
    "core/bundle",
    "core/net",
    "core/connectors",
    "core/deliver",
    "core/update",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
dirs = "7"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
