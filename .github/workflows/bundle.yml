name: Bundle

# Builds the real installers and exercises them on real machines.
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer (build, install, upgrade, uninstall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the NSIS installer
        working-directory: app
        shell: bash
        run: ../scripts/ci/run.sh "Build NSIS installer" ../ui/node_modules/.bin/tauri build --bundles nsis
      - name: Find the installer
        id: find
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse -Path target\release\bundle\nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $f) { throw 'no installer built' }
          "path=$($f.FullName)" >> $env:GITHUB_OUTPUT
          "### Installer: $($f.Name) ($([math]::Round($f.Length / 1MB, 1)) MB)" >> $env:GITHUB_STEP_SUMMARY
      - name: Silent install, upgrade, uninstall
        shell: bash
        run: scripts/ci/run.sh "Windows installer smoke test" pwsh -NoProfile -File installers/windows/smoke-test.ps1 -Installer '${{ steps.find.outputs.path }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.find.outputs.path }}
          retention-days: 7

  linux:
    name: Linux AppImage (build, install, run, quit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libxdo-dev xvfb xdotool dbus-x11 file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install script tests (fake AppImage)
        run: scripts/ci/run.sh "Linux install script tests" ./installers/linux/test-install.sh
      - name: Build the AppImage
        working-directory: app
        env:
          NO_STRIP: "true"
        run: ../scripts/ci/run.sh "Build AppImage" ../ui/node_modules/.bin/tauri build --bundles appimage
      - name: Install, run and quit the real AppImage
        run: scripts/ci/run.sh "AppImage smoke test" ./installers/linux/smoke-test.sh
      - name: Build the test helpers (a tray stand-in and a fake program)
        run: cargo build -p cargoframe-capture --examples
      - name: Idle cost of the tray-only process (release binary)
        env:
          CARGOFRAME_PERF_SCALE: "2"
        run: scripts/ci/run.sh "idle check" scripts/e2e/linux-idle.sh
      - name: Window open times (release binary, virtual display)
        env:
          CARGOFRAME_PERF_SCALE: "2"
        run: scripts/ci/run.sh "open times" scripts/e2e/linux-open-times.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            installers/linux/install.sh
            installers/linux/uninstall.sh
            app/icons/128x128.png
          retention-days: 7
