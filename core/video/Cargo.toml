[package]
name = "cargoframe-video"
description = "CargoFrame core: the rolling buffer of a recording, the edits made to a clip, and the ffmpeg command that applies them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Windows only: the sound a computer plays (and one program's sound) can only be heard through the
# Windows sound system, ffmpeg cannot do it.
[target.'cfg(windows)'.dependencies]
wasapi = "0.27"

[dev-dependencies]
tempfile.workspace = true
