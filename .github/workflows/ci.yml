name: CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI (check, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Report bundle size
        run: |
          echo "### UI bundle size (gzip)" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/assets/*.js dist/assets/*.css; do
            printf '%s: %s bytes\n' "$f" "$(gzip -c "$f" | wc -c)" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7

  rust:
    name: Rust (${{ matrix.os }})
    needs: ui
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libxdo-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/ci/run.sh "cargo fmt" cargo fmt --all -- --check
      - name: Lint
        shell: bash
        run: scripts/ci/run.sh "cargo clippy" cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (Linux, with a virtual display for the capture tests)
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/ci/run.sh "cargo test" xvfb-run -a -s "-screen 0 1280x800x24" cargo test --workspace
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/ci/run.sh "cargo test" cargo test --workspace
