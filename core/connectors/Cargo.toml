[package]
name = "cargoframe-connectors"
description = "CargoFrame core: connectors (Jira, Google, Reddit, Claude, Slack, Discord, Teams, X, Bluesky, Instagram, GitHub, custom APIs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# One feature per service. A build without one has none of that service's code: see
# docs/design.md, "For companies". The settings models stay, so a saved connection of a
# service left out still reads and is shown as "not in this build".
[features]
default = ["jira", "google", "reddit", "claude", "slack", "discord", "teams", "custom", "x", "bluesky", "instagram", "github"]
jira = []
google = []
reddit = []
claude = []
slack = []
discord = []
teams = []
custom = []
x = ["png"]
bluesky = ["png"]
instagram = ["png", "jpeg-encoder"]
github = []

[dependencies]
cargoframe-net = { path = "../net" }
cargoframe-safe = { path = "../safe" }
cargoframe-context = { path = "../context" }
cargoframe-handoff = { path = "../handoff" }
cargoframe-deliver = { path = "../deliver" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
# Only for the services that need a picture made smaller or made a JPEG.
png = { version = "0.18", optional = true }
jpeg-encoder = { version = "0.6", optional = true }

[dev-dependencies]
cargoframe-net = { path = "../net", features = ["mock"] }
