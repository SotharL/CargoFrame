[package]
name = "cargoframe"
description = "CargoFrame: capture, review and share your screen with its context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "cargoframe"

[lib]
name = "cargoframe_app"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cargoframe-config = { path = "../core/config" }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
zbus = { version = "5", default-features = false, features = ["blocking-api"] }
