# The window's TypeScript copies of Rust types are written by `cargo test` (ts-rs, test-only),
# into the UI, and compared with the committed ones by scripts/dev/check.sh and CI.
[env]
TS_RS_EXPORT_DIR = { value = "ui/src/lib/generated", relative = true }
# numbers the window reads (sizes, milliseconds) are plain JavaScript numbers
TS_RS_LARGE_INT = "number"
