[package]
name = "cargoframe-keys"
description = "CargoFrame core: the keys pressed while a recording runs, to show them over the clip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The keyboard is read with the operating system's own calls. Unsafe code is denied everywhere
# except the Windows module that needs it.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
serde.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json.workspace = true
