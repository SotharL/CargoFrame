[package]
name = "cargoframe-net"
description = "CargoFrame core: a small HTTP layer (requests, multipart, a real client, a mock server for tests)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A tiny local HTTP server for contract tests. Only enabled by dev-dependencies.
mock = []

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
getrandom = "0.4"
# `platform-verifier`: trust the certificates the operating system trusts, so a company's own
# certificate (for example one its network inspection uses) works on Windows and on Linux alike.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }

[target.'cfg(windows)'.dependencies]
# Windows also hands over the proxy the person's organisation set.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier", "win-system-proxy"] }

[dev-dependencies]
# Lets the integration tests use the mock server.
cargoframe-net = { path = ".", features = ["mock"] }
